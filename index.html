<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kabaddi App</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Custom CSS -->
<link rel="icon" type="image/png" href="assets/icons/rx-favicon.png">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f97316">

<link rel="apple-touch-icon" href="assets/icons/raidx-192.png">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-950 text-white">

  <!-- LOGIN OVERLAY -->
<!-- LOGIN OVERLAY (सर्वात वर टाका) -->
<div id="loginOverlay" class="fixed inset-0 bg-gray-950 z-[1000] flex flex-col items-center justify-center p-6">
    <div class="text-center">
        <div class="w-20 h-20 bg-green-600 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-green-900/20">
            <i class="fas fa-trophy text-3xl text-white"></i>
        </div>
        <h1 class="text-3xl font-black tracking-tighter mb-2">KABADDI SCORE PRO</h1>
        <p class="text-gray-500 text-sm mb-8">टूर्नामेंट मॅनेजमेंट आणि लाईव्ह स्कोअरिंग</p>
        
        <button onclick="login()" class="flex items-center gap-4 bg-white text-gray-950 px-8 py-4 rounded-2xl font-bold hover:bg-gray-200 transition-all active:scale-95 shadow-xl">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6">
            Login with Google
        </button>
    </div>
</div>

<!-- HEADER -->
<div class="flex items-center justify-between p-4 bg-gray-900 border-b border-gray-800">
  <button onclick="toggleMenu()">☰</button>
  <h1 class="text-lg font-bold">Kabaddi App</h1>
  <button>⚙️</button>
</div>

<!-- SIDE DRAWER -->
<div id="sidebar" class="fixed top-0 left-0 w-72 h-full bg-[#0a0a0a] transform -translate-x-full transition-transform duration-300 z-[60] shadow-[10px_0_30px_rgba(0,0,0,0.5)] border-r border-white/5">
    
<div class="p-6 mb-4 flex flex-col items-center border-b border-white/5">
    <img src="assets/logo/raidx-512.png" alt="RaidX" class="w-28 mb-2 object-contain"> 
    
    <p class="text-[10px] text-gray-400 font-black uppercase tracking-[3px]">दमदार कबड्डी</p>
</div>

    <div class="px-4 space-y-2">
        <button onclick="loadPage('home')" class="drawer-item flex items-center gap-4 w-full text-left py-3 px-4 rounded-xl text-gray-300 hover:bg-orange-500/10 transition-all">
            <i class="fa-solid fa-house w-5 text-orange-500"></i>
            <span class="text-sm font-bold uppercase tracking-wider">Home</span>
        </button>

        <button id="side-matches" onclick="loadPage('matches')" class="drawer-item flex items-center gap-4 w-full text-left py-3 px-4 rounded-xl text-gray-300 hover:bg-orange-500/10 transition-all">
            <i class="fa-solid fa-calendar-day w-5 text-orange-500"></i>
            <span class="text-sm font-bold uppercase tracking-wider">Matches</span>
        </button>

        <button id="side-teams" onclick="loadPage('teams')" class="drawer-item flex items-center gap-4 w-full text-left py-3 px-4 rounded-xl text-gray-300 hover:bg-orange-500/10 transition-all">
            <i class="fa-solid fa-users w-5 text-orange-500"></i>
            <span class="text-sm font-bold uppercase tracking-wider">Teams</span>
        </button>

        <button id="side-tournaments" onclick="loadPage('tournaments')" class="drawer-item active-drawer flex items-center gap-4 w-full text-left py-3 px-4 rounded-xl text-white bg-orange-600 shadow-lg shadow-orange-900/20 transition-all">
            <i class="fa-solid fa-trophy w-5 text-white font-bold"></i>
            <span class="text-sm font-black uppercase tracking-wider">Tournaments</span>
        </button>

        <div class="border-t border-white/5 my-4 pt-4">
             <button class="drawer-item flex items-center gap-4 w-full text-left py-3 px-4 rounded-xl text-gray-400 hover:text-white transition-all">
                <i class="fa-solid fa-gear w-5"></i>
                <span class="text-sm font-bold uppercase tracking-wider">Settings</span>
            </button>
            <button class="drawer-item flex items-center gap-4 w-full text-left py-3 px-4 rounded-xl text-gray-400 hover:text-white transition-all">
                <i class="fa-solid fa-cloud-arrow-up w-5"></i>
                <span class="text-sm font-bold uppercase tracking-wider">Backup & Restore</span>
            </button>
        </div>
    </div>

    <div class="absolute bottom-8 left-0 w-full px-6">
        <button onclick="toggleMenu()" class="flex items-center justify-center gap-2 w-full py-3 rounded-xl border border-red-500/30 text-red-500 font-bold uppercase text-[10px] tracking-widest active:scale-95 transition-all">
            <i class="fa-solid fa-xmark"></i> Close Menu
        </button>
    </div>
</div>

<div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[55] hidden transition-opacity"></div>

<!-- OVERLAY 
<div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black bg-opacity-50 hidden"></div>-->

<!-- MAIN CONTENT -->
<div id="app" class="p-4 pb-20">
  <h2 class="text-xl">Welcome 👋</h2>
</div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 left-0 right-0 bg-[#0f0f0f] border-t border-gray-800 flex justify-around items-center py-2 z-50">
  
  <button id="nav-home" onclick="loadPage('home')" class="nav-btn flex flex-col items-center justify-center gap-1 transition-all">
    <i class="fa-solid fa-house text-lg"></i>
    <span class="text-[9px] font-black uppercase tracking-widest">Home</span>
  </button>

  <button id="nav-matches" onclick="loadPage('matches')" class="nav-btn flex flex-col items-center justify-center gap-1 transition-all text-gray-500">
    <i class="fa-solid fa-calendar-days text-lg"></i>
    <span class="text-[9px] font-black uppercase tracking-widest">Matches</span>
  </button>

  <button id="nav-teams" onclick="loadPage('teams')" class="nav-btn flex flex-col items-center justify-center gap-1 transition-all text-gray-500">
    <i class="fa-solid fa-users text-lg"></i>
    <span class="text-[9px] font-black uppercase tracking-widest">Teams</span>
  </button>

  <button id="nav-tournaments" onclick="loadPage('tournaments')" class="nav-btn flex flex-col items-center justify-center gap-1 transition-all text-gray-500">
    <i class="fa-solid fa-trophy text-lg"></i>
    <span class="text-[9px] font-black uppercase tracking-widest">Tournaments</span>
  </button>

  <button id="nav-profile" onclick="loadPage('profile')" class="nav-btn flex flex-col items-center justify-center gap-1 transition-all text-gray-500">
    <i class="fa-solid fa-user text-lg"></i>
    <span class="text-[9px] font-black uppercase tracking-widest">Profile</span>
  </button>

</div>

  <!-- युजरला स्वतः टीम्स, तारीख आणि वेळ निवडता यावी यासाठी tournaments.html मध्ये हा पॉपअप ॲड कर: -->

<div id="matchSetterModal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center z-[150] p-4">
  <div class="bg-gray-900 p-6 rounded-2xl w-full max-w-sm border border-gray-700 shadow-2xl">
    <h3 class="text-white font-bold text-lg mb-4 text-center">मॅच सेट करा</h3>
    
    <div class="space-y-4">
      <div>
        <label class="text-[10px] text-gray-400">Team A</label>
        <select id="mTeamA" class="w-full mt-1 p-3 bg-gray-800 rounded-xl text-sm text-white border border-gray-700 outline-none"></select>
      </div>
      
      <div class="text-center text-gray-500 font-bold">VS</div>

      <div>
        <label class="text-[10px] text-gray-400">Team B</label>
        <select id="mTeamB" class="w-full mt-1 p-3 bg-gray-800 rounded-xl text-sm text-white border border-gray-700 outline-none"></select>
      </div>
      
      <div class="grid grid-cols-2 gap-3">
        <input id="mDate" type="date" class="p-2 bg-gray-800 rounded-lg text-xs text-white border border-gray-700">
        <input id="mTime" type="time" class="p-2 bg-gray-800 rounded-lg text-xs text-white border border-gray-700">
      </div>
    </div>

    <div class="flex flex-col gap-2 mt-6">
      <button onclick="saveMatchDetails()" class="w-full bg-green-600 p-3 rounded-xl text-white font-bold text-sm">Update Match</button>
      <button onclick="closeMatchSetter()" class="w-full py-2 text-gray-400 text-xs">Cancel</button>
    </div>
  </div>
</div>

<!-- Start Match Moda -->
<div id="startMatchModal" class="fixed inset-0 bg-black bg-opacity-90 z-[200] hidden flex-col p-4 items-center justify-center">
    <div class="bg-gray-900 w-full max-w-md rounded-2xl border border-gray-800 shadow-2xl overflow-hidden flex flex-col h-[90vh]">
        
        <div class="p-4 border-b border-gray-800 bg-gray-900 shrink-0">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-black text-white uppercase italic">Setup Match</h2>
                <button onclick="closeStartMatchModal()" class="text-gray-500">✕</button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto custom-scroll">
            <div class="p-4 bg-gray-800/30 border-b border-gray-800">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[9px] text-gray-500 uppercase font-bold">Toss Winner</label>
                        <select id="tossWinner" class="w-full bg-gray-900 text-white text-[11px] p-2 rounded-lg border border-gray-700 mt-1 outline-none"></select>
                    </div>
                    <div>
                        <label class="text-[9px] text-gray-500 uppercase font-bold">Selection</label>
                        <select id="tossSelection" class="w-full bg-gray-900 text-white text-[11px] p-2 rounded-lg border border-gray-700 mt-1 outline-none">
                            <option value="Raid">Raid</option>
                            <option value="Ground">Ground</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex bg-gray-800 sticky top-0 z-20">
                <button id="tabBtnA" onclick="switchPlayerTab('A')" class="flex-1 py-3 text-[10px] font-black border-b-2 border-green-600 text-white truncate px-2">TEAM A</button>
                <button id="tabBtnB" onclick="switchPlayerTab('B')" class="flex-1 py-3 text-[10px] font-black border-b-2 border-transparent text-gray-500 truncate px-2">TEAM B</button>
            </div>

            <div class="p-3">
                <div id="playerListA" class="space-y-1.5"></div>
                <div id="playerListB" class="space-y-1.5 hidden"></div>
            </div>
        </div>

        <div class="p-4 bg-gray-900 border-t border-gray-800 shrink-0">
            <button onclick="confirmStartMatch()" class="w-full py-3.5 text-xs font-black text-white bg-green-600 rounded-xl shadow-lg active:scale-95 transition-all uppercase tracking-widest">
                Start Live Scoring
            </button>
        </div>
    </div>
</div>

<div id="custom-splash" class="fixed inset-0 z-[100] flex items-center justify-center bg-black transition-opacity duration-700">
        <img src="assets/logo/splash screen.jpg" class="w-full h-full object-cover" alt="RaidX">
    </div>

    <div id="app">
        </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('custom-splash');
                if (splash) {
                    splash.style.opacity = '0'; // फिकट होईल
                    setTimeout(() => splash.remove(), 700); // डोम मधून निघून जाईल
                }
            }, 2500); // २.५ सेकंद फोटो दिसेल
        });
    </script>



<!-- JS FILE -->
 <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<!-- ही नवीन ओळ ॲड कर (Authentication साठी) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log("Service Worker Registered"))
      .catch(err => console.log("SW Registration Failed", err));
  }
</script>

</body>
</html>
