<div class="p-3 space-y-4 animate-fadeIn">
    
  <div class="flex justify-between items-center bg-[#111] p-3 rounded-2xl border border-gray-800 shadow-lg">
    <div class="flex items-center space-x-3">
        <div class="p-2.5 bg-orange-600/10 rounded-xl border border-orange-600/20 shadow-inner">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
        </div>
        <div>
            <h2 class="text-xs font-black text-white uppercase tracking-widest">मास्टर लिस्ट</h2>
            <p class="text-[8px] text-gray-500 font-bold uppercase opacity-60">Team Management</p>
        </div>
    </div>
    <button onclick="showCreateNewTeamForm()" class="bg-orange-600 px-5 py-2.5 rounded-xl text-[10px] font-black text-white uppercase shadow-[0_4px_12px_rgba(249,115,22,0.3)] active:scale-95 transition-all">
        + Add New
    </button>
</div>

   

<div class="flex flex-col lg:flex-row gap-3">
    
    <div class="grid grid-cols-2 gap-2 w-full lg:w-1/2">
        <div class="relative">
            <select id="masterPageGroupFilter" onchange="loadMasterTeamsList()" 
                class="w-full p-3 bg-[#111] rounded-xl text-[10px] font-bold text-white border border-gray-800 outline-none uppercase tracking-widest appearance-none focus:border-orange-500">
                <option value="All">सर्व गट (ALL)</option>
                <option value="A">Group A</option>
                <option value="B">Group B</option>
                <option value="C">Group C</option>
                <option value="Vaysayik">व्यावसायिक</option>
                <option value="Special">विशेष व्यावसायिक</option>
                <option value="Women">महिला</option>
            </select>
            <span class="absolute right-3 top-3.5 text-gray-500 pointer-events-none text-[8px]">▼</span>
        </div>

        <div class="relative">
            <select id="masterPageStatusFilter" onchange="loadMasterTeamsList()" 
                class="w-full p-3 bg-[#111] rounded-xl text-[10px] font-bold text-white border border-gray-800 outline-none uppercase tracking-widest appearance-none focus:border-orange-500">
                <option value="All">सर्व स्टेटस</option>
                <option value="Active">Active ✅</option>
                <option value="Banned">Banned ❌</option>
                <option value="Pending">Pending ⏳</option>
            </select>
            <span class="absolute right-3 top-3.5 text-gray-500 pointer-events-none text-[8px]">▼</span>
        </div>
    </div>

    <div class="relative w-full lg:w-1/2">
        <input type="text" id="masterTeamPageSearch" oninput="loadMasterTeamsList()" placeholder="टीमचे नाव शोधा..." 
            class="w-full p-3 bg-[#111] rounded-xl text-xs text-white border border-gray-800 focus:border-orange-500 outline-none pl-10 shadow-inner">
        <span class="absolute left-3 top-3 text-sm opacity-50">🔍</span>
    </div>
</div>

<div id="masterTeamListContainer" class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mt-6">
    </div>
</div>
