<div id="managementPageView" class="space-y-4 px-4 py-2 animate-fadeIn">
    
    <div class="flex justify-between items-center bg-[#0d0d0d] p-4 rounded-2xl border border-white/5 shadow-md">
        <div>
            <h2 class="text-sm font-black uppercase text-white tracking-tight italic flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-orange-500 text-xs"></i> अधिकृत व्यवस्थापन (Staff Access)
            </h2>
            <p class="text-[9px] text-gray-500 uppercase font-bold tracking-widest font-mono mt-0.5">App Roles & Association Console</p>
        </div>
        
        <div class="flex items-center gap-2">
            <span class="hidden sm:inline-block bg-amber-500/10 border border-amber-500/20 text-amber-500 font-mono text-[8px] font-black px-2.5 py-1 rounded-xl uppercase tracking-wider">
                Superadmin Shield
            </span>
            <button onclick="openAddStaffModal()" 
                    class="bg-orange-600 hover:bg-orange-700 text-white text-[11px] font-black uppercase tracking-wider px-3 py-1.5 rounded-xl shadow-md transition-all active:scale-[0.98] flex items-center gap-1 italic">
                <i class="fa-solid fa-user-plus text-[10px]"></i> नवीन रोल जोडा
            </button>
        </div>
    </div>

    <div class="space-y-2 bg-[#111]/40 p-1 rounded-2xl border border-white/[0.02]">
        <div class="text-[9px] text-gray-500 font-black uppercase tracking-widest px-1 flex items-center gap-1">
            <i class="fa-solid fa-users text-gray-600"></i> सिस्टीममधील सक्रिय स्टाफ यादी (Active Officials)
        </div>
        
        <div id="mgmtStaffListContainer" class="space-y-2">
            </div>
    </div>
</div>


<div id="staffModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fadeIn">
    
    <div class="bg-[#111] w-full max-w-md rounded-2xl border border-gray-800/80 shadow-2xl overflow-hidden transform transition-all scale-95 duration-200">
        
        <div class="flex justify-between items-center bg-[#0d0d0d] p-4 border-b border-white/5">
            <h3 class="text-xs font-black uppercase text-orange-500 tracking-wider flex items-center gap-2 italic">
                <i class="fa-solid fa-user-gear"></i> नवीन रोल असाइन / अपडेट करा
            </h3>
            <button onclick="closeStaffModal()" class="text-gray-500 hover:text-white transition-colors">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <div class="p-4 space-y-4">
            <form id="staffRoleForm" autocomplete="off" onsubmit="event.preventDefault();">
                
                <div class="space-y-3">
                    <div>
                        <label class="text-[9px] text-gray-400 font-black uppercase block mb-1">गुगल ऑथ ईमेल (Google Auth Email) <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-600"><i class="fa-solid fa-envelope text-[10px]"></i></span>
                            <input type="email" id="mgmtUserEmail" placeholder="example@gmail.com" required
                                   class="w-full bg-gray-950 border border-gray-800 rounded-xl pl-8 pr-3 py-2.5 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-orange-500/50 font-mono" />
                        </div>
                    </div>

                    <div>
                        <label class="text-[9px] text-gray-400 font-black uppercase block mb-1">पद / रोल निवडा (Select System Designation) <span class="text-danger">*</span></label>
                        <select id="mgmtUserRole" onchange="toggleMgmtAssocField()"
                                class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-orange-500/50 font-sans font-bold">
                            <option value="Admin">Association Admin (असोसिएशन ॲडमिन)</option>
                            <option value="Scorer">Official Scorer / Umpire (स्कोअरर)</option>
                            <option value="Superadmin">Co-Superadmin (सह-सुपरॲडमिन)</option>
                        </select>
                    </div>

                    <div id="mgmtAssocWrapper">
                        <label class="text-[9px] text-gray-400 font-black uppercase block mb-1">असोसिएशनचे नाव (स्वल्पविराम देऊन एकापेक्षा जास्त जोडू शकता)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-600"><i class="fa-solid fa-building text-[10px]"></i></span>
                            <input type="text" id="mgmtUserAssocs" placeholder="MUMBAI_SHAHAR, PUNE_DISTRICT" 
                                   class="w-full bg-gray-950 border border-gray-800 rounded-xl pl-8 pr-3 py-2.5 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-orange-500/50 uppercase font-mono font-bold tracking-wide" />
                        </div>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="button" onclick="executeRoleUpdate()" 
                            class="w-full bg-orange-600 hover:bg-orange-700 text-white text-xs font-black uppercase tracking-wider py-2.5 rounded-xl shadow-md transition-all active:scale-[0.98] italic">
                        🔑 सुरक्षित परवानग्या सेव्ह करा
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
