<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KVCUP 2026 - Live Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
        .font-title { font-family: 'Poppins', sans-serif; }
        @keyframes pulse-red { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.4; } }
        .live-blink { animation: pulse-red 1.5s infinite ease-in-out; }
    </style>
</head>
<body class="text-slate-200 min-h-screen pb-12">

    <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-50 px-4 py-3 backdrop-blur-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-trophy text-yellow-500 text-lg"></i>
                <h1 class="font-title font-black text-base text-yellow-500 tracking-tight">KVCUP 2026</h1>
            </div>
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-circle-user text-slate-400 text-lg"></i>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-5 space-y-5">
        
        <div class="space-y-2.5">
            <div class="flex items-center gap-1.5 text-[10px] font-black tracking-wider text-slate-400 uppercase">
                <span class="w-1.5 h-1.5 rounded-full bg-red-500 live-blink"></span> LIVE MATCH
            </div>
            
            <div id="liveScoreCardContainer">
                <div class="bg-slate-900/40 border border-slate-850 rounded-2xl p-6 text-center text-slate-500 italic text-xs font-bold">
                    सध्या ग्राउंडवर कोणताही सामना सुरू नाही.
                </div>
            </div>
        </div>

        <div class="space-y-2.5 pt-1">
            <div class="text-[10px] font-black tracking-wider text-slate-400 uppercase">
                <i class="fa-solid fa-layer-group text-amber-500 mr-1"></i> TOURNAMENTS
            </div>
            
            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl group">
                <div class="h-32 bg-gradient-to-br from-amber-600/30 to-slate-900 p-4 flex flex-col justify-between relative">
                    <div class="absolute right-3 top-3 bg-black/40 backdrop-blur-md text-[9px] font-black px-2 py-0.5 rounded text-yellow-500">BOGURA</div>
                    <div>
                        <h3 class="font-title font-black text-white text-base leading-tight uppercase tracking-tight">SHOHID ZIA KABADDI CHAMPIONSHIP</h3>
                        <p class="text-[9px] text-slate-400 font-bold mt-0.5 uppercase tracking-wide">Aharan Jubo Sangho's Club</p>
                    </div>
                </div>
                <div class="p-3 bg-slate-950 flex justify-between items-center text-xs font-bold text-slate-400">
                    <span>View Tournament Fixtures</span>
                    <i class="fa-solid fa-chevron-right text-[10px] text-slate-600 group-hover:text-yellow-500 transition-colors"></i>
                </div>
            </div>
        </div>

    </main>

    <script>
        // 💡 [IMPORTANT]: तुझ्या प्रोजेक्ट मधील firebaseConfig आणिinitializeApp इथे आधीच असेल.
        // आपण फक्त 'live_score_hub' या अत्यंत छोट्या नोडवर लक्ष ठेवणार आहोत (LISTEN TO LIGHTWEIGHT NODE ONLY)
        
        function listenToLiveScoreHub() {
            const container = document.getElementById('liveScoreCardContainer');
            if (!container) return;

            // डमी फायरबेस पासिंग रिप्रेंटेशन (तुझ्या Realtime DB च्या ऑन-व्हॅल्यू मध्ये हे टाक भावा)
            // db.ref('live_score_hub').on('value', (snapshot) => { ... })
            
            const match = {
                isLive: true, // जर स्कोअररने मॅच एंड केली तर हे false होईल
                round: "Group C Match, T10 • Today",
                teamA: "JUMMAN XI",
                scoreA: 8,
                teamB: "ZAKIR STORE",
                scoreB: 9,
                status: "2nd Half"
            };

            if (!match || !match.isLive) {
                container.innerHTML = `
                    <div class="bg-slate-900/40 border border-slate-850 rounded-2xl p-6 text-center text-slate-500 italic text-xs font-bold">
                        सध्या ग्राउंडवर कोणताही सामना सुरू नाही.
                    </div>`;
                return;
            }

            // क्रिकहिरोज सारखे कडक, गच्च आणि प्रिमियम लाईव्ह स्कोअर कार्ड! 🦾
            container.innerHTML = `
                <div class="bg-gradient-to-b from-slate-900 to-slate-950 border border-slate-800 rounded-2xl p-4 shadow-2xl space-y-4 relative overflow-hidden">
                    <div class="absolute top-0 inset-x-0 h-[1.5px] bg-gradient-to-r from-transparent via-red-500/40 to-transparent"></div>
                    
                    <div class="flex justify-between items-center border-b border-slate-850/60 pb-2">
                        <span class="text-[9px] font-black text-slate-500 uppercase tracking-tight">${match.round}</span>
                        <span class="text-[8.5px] font-black bg-red-600/10 text-red-400 border border-red-500/20 px-2 py-0.5 rounded-md flex items-center gap-1 font-mono uppercase">
                            <span class="w-1.5 h-1.5 rounded-full bg-red-500 live-blink"></span> ${match.status}
                        </span>
                    </div>

                    <div class="space-y-3.5 py-1">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2.5 truncate">
                                <span class="w-2.5 h-2.5 rounded-full bg-green-500 shrink-0 shadow-[0_0_8px_rgba(34,197,94,0.4)]"></span>
                                <span class="text-sm font-black text-white uppercase tracking-tight truncate max-w-[200px]">${match.teamA}</span>
                            </div>
                            <span class="text-3xl font-black text-white font-mono tracking-tighter">${match.scoreA}</span>
                        </div>

                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2.5 truncate">
                                <span class="w-2.5 h-2.5 rounded-full bg-blue-500 shrink-0 shadow-[0_0_8px_rgba(59,130,246,0.4)]"></span>
                                <span class="text-sm font-black text-white uppercase tracking-tight truncate max-w-[200px]">${match.teamB}</span>
                            </div>
                            <span class="text-3xl font-black text-white font-mono tracking-tighter">${match.scoreB}</span>
                        </div>
                    </div>

                    <div onclick="openMatchCentreFromHome()" class="mt-2 pt-2.5 border-t border-slate-850/60 flex justify-between items-center text-[10px] font-black text-yellow-500 cursor-pointer hover:text-yellow-400">
                        <span class="uppercase tracking-tight"><i class="fa-solid fa-chart-line mr-1"></i> Open Match Centre</span>
                        <i class="fa-solid fa-arrow-right-long text-[9px]"></i>
                    </div>
                </div>
            `;
        }

        function openMatchCentreFromHome() {
            console.log("🚀 User clicked to view details! Triggering detailed modal and reading heavy lists now...");
            // तुझ्या app.js मधील मोडल ओपन करण्याचे फंक्शन (उदा. openSummaryModal() किंवा switchTimelineTab) इथे कॉल करायचे!
            if (typeof openSummaryModal === "function") openSummaryModal();
        }

        window.onload = listenToLiveScoreHub;
    </script>
</body>
</html>
