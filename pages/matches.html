<div class="space-y-4 pb-24 font-sans select-none anim-fade-in animate-duration-200 px-4">
    
    <div class="flex justify-between items-center pt-2">
        <h2 class="text-sm font-black text-white uppercase tracking-wider italic">
            <i class="fa-solid fa-gamepad text-orange-500 mr-1.5 shadow-[0_0_8px_#f97316]"></i> सामने वेळापत्रक
        </h2>
        
        <button onclick="toggleMatchFilterDrawer(true)" class="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800/80 px-3 py-1.5 rounded-xl text-[9px] font-black uppercase text-zinc-300 flex items-center gap-1 active:scale-95 transition-all">
            <i class="fa-solid fa-sliders text-orange-500"></i> फिल्टर्स (Filters)
        </button>
    </div>

    <div class="flex gap-2 pb-1 overflow-x-auto scrollbar-none text-[8.5px] font-black uppercase tracking-wider" style="scrollbar-width: none;">
        <button onclick="switchMatchesPageTab('LIVE')" id="matchTab-LIVE" class="px-4 py-2 rounded-xl bg-orange-600 text-white shadow-md active:scale-95 transition-all flex items-center gap-1 shrink-0">
            <span class="w-1 h-1 rounded-full bg-white live-blink"></span> Live
        </button>
        <button onclick="switchMatchesPageTab('UPCOMING')" id="matchTab-UPCOMING" class="px-4 py-2 rounded-xl bg-zinc-900 text-zinc-400 border border-zinc-800/80 active:scale-95 transition-all shrink-0">
            ⏳ Upcoming
        </button>
        <button onclick="switchMatchesPageTab('FINISHED')" id="matchTab-FINISHED" class="px-4 py-2 rounded-xl bg-zinc-900 text-zinc-400 border border-zinc-800/80 active:scale-95 transition-all shrink-0">
            🏁 Finished
        </button>
    </div>

    <div id="activeFiltersBadgeRow" class="flex flex-wrap gap-1.5 text-[7.5px] font-black uppercase tracking-wider hidden"></div>

    <div id="globalMatchesContainer" class="space-y-3.5">
        <div class="text-center py-12 text-zinc-700 italic font-black text-xs uppercase tracking-widest animate-pulse">
            सामने लोड होत आहेत...
        </div>
    </div>

<div id="matchFilterDrawer" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center transition-all duration-300 pointer-events-none opacity-0">
    <div class="w-full max-w-md bg-zinc-950 border border-zinc-900 rounded-t-3xl p-5 flex flex-col shadow-[0_-10px_30px_rgba(0,0,0,0.8)] transform translate-y-full transition-transform duration-300 pb-24">
        
        <div class="flex justify-between items-center border-b border-zinc-900 pb-3 shrink-0">
            <span class="text-xs font-black text-white uppercase tracking-wider"><i class="fa-solid fa-filter text-orange-500 mr-1"></i> सामने फिल्टर करा</span>
            <button onclick="toggleMatchFilterDrawer(false)" class="text-zinc-500 hover:text-white text-xs p-1"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
<div class="max-h-[200px] overflow-y-auto py-3 space-y-3 text-[10px] font-bold uppercase tracking-wide text-zinc-400 pr-1 scrollbar-none" style="scrollbar-width: none;">
    <div class="space-y-1">
        <label>📆 सीझन (Season)</label>
        <select id="filterSeason" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-white font-mono outline-none focus:border-orange-500">
            </select>
    </div>

    <div class="space-y-1">
        <label>🏢 असोसिएशन (Association)</label>
        <select id="filterAssociation" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-white outline-none focus:border-orange-500">
            </select>
    </div>

    <div class="space-y-1">
        <label>👥 ग्रुप / गट (Group)</label>
        <select id="filterGroup" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-white outline-none focus:border-orange-500">
            </select>
    </div>

    <div class="space-y-1">
        <label>🏆 लेव्हल (Level)</label>
        <select id="filterLevel" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-white outline-none focus:border-orange-500">
            </select>
    </div>
</div>

        <div class="grid grid-cols-2 gap-3 pt-3 border-t border-zinc-900 text-[10px] font-black uppercase mt-1 shrink-0">
            <button onclick="resetMatchesFilters()" class="w-full bg-zinc-900 border border-zinc-800 py-3 rounded-xl text-zinc-400 active:scale-95 transition-all">
                Clear All
            </button>
            <button onclick="applyMatchesFilters()" class="w-full bg-orange-600 py-3 rounded-xl text-white shadow-lg shadow-orange-600/20 active:scale-95 transition-all">
                Apply Filters
            </button>
        </div>
    </div>
</div>

</div>
