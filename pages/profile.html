<!-- pages/profile.html -->
<div class="w-full space-y-2 font-sans text-gray-200 antialiased px-3 pt-2 max-w-md mx-auto min-h-screen pb-24 anim-fade-in animate-duration-300">
    
    <!-- 🎯 BACK BUTTON CONTAINER (फक्त जेव्हा डेटा असेल तेव्हाच जागा घेईल, एरवी hidden राहील) -->
    <div id="profileBackButtonContainer" class="hidden flex items-center justify-start mb-1">
        <!-- स्क्वाडमधून आल्यावर बॅक बटण इथे इंजेक्ट होईल -->
    </div>

    <!-- 🎯 SECTION A: MAIN PLAYER CARD (आता एकदम टॉपला कडक बसेल, जागा अजिबात वाया जाणार नाही) -->
    <div class="bg-gradient-to-r from-slate-900 to-slate-950 border border-slate-800 rounded-2xl p-3 flex items-center gap-3 relative overflow-hidden shadow-xl">
        <div class="absolute left-0 inset-y-0 w-[2px] bg-gradient-to-b from-transparent via-green-500/50 to-transparent"></div>
        
        <!-- डाव्या बाजूला खेळाडूचा छोटा गोल फोटो -->
        <div class="relative shrink-0">
            <img id="userProfilePic" src="" class="w-12 h-12 rounded-full border-2 border-green-600 shadow-md object-cover bg-zinc-900">
            <!-- जर्सी नंबर फोटोच्या कोपऱ्यात छोटा बॅज -->
            <div class="absolute -bottom-1 -right-1 bg-orange-500 text-black font-mono font-black text-[8px] px-1 rounded" id="profJerseyNo">
                #--
            </div>
        </div>

        <!-- शेजारी खेळाडूची माहिती (नाव आणि टीमला मुख्य प्राधान्य) -->
        <div class="flex-1 min-w-0 space-y-0.5">
            <div class="flex items-center gap-2">
                <h2 id="userDisplayName" class="text-sm font-black text-white uppercase tracking-tight truncate">Loading...</h2>
                <span class="inline-block text-[7.5px] font-black text-orange-400 uppercase tracking-wider bg-orange-500/5 border border-orange-500/10 px-1 rounded" id="profPlayerRole">
                    ---
                </span>
            </div>

            <!-- करंट टीम आणि रजिस्ट्रेशन नंबर एकाच ओळीत कॉम्पॅक्ट -->
            <div class="flex items-center gap-x-2 text-[9px] text-zinc-400 font-bold">
                <div class="truncate">
                    <i class="fa-solid fa-shield-halved text-zinc-500 text-[8px] mr-0.5"></i> 
                    TEAM: <span class="text-orange-400 uppercase font-black" id="profCurrentTeam">LOADING...</span>
                </div>
                <div class="text-zinc-700">|</div>
                <div>
                    <i class="fa-solid fa-id-card text-zinc-500 text-[8px] mr-0.5"></i> 
                    REG: <span class="text-zinc-300" id="profRegNo">00000</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 🎯 COMPACT SEASON FILTER -->
    <div class="flex items-center justify-between bg-slate-900/40 border border-slate-850/60 rounded-xl px-2.5 py-1 text-[9px] text-zinc-400 font-bold">
        <span>📊 STATS OVERVIEW</span>
        <div class="bg-zinc-950 px-1.5 py-0.5 rounded border border-zinc-850">
            <select id="profileSeasonFilter" onchange="handleSeasonFilterChange()" class="bg-transparent text-[8.5px] font-black uppercase text-orange-500 focus:outline-none cursor-pointer">
                <option value="2026" selected>Season 2026-2027</option>
                <option value="2025">Season 2025-2026</option>
                <option value="all">All Time</option>
            </select>
        </div>
    </div>

    <!-- LOADING STATE -->
    <div id="playerStatsLoadingState" class="flex items-center justify-center gap-2 py-6 text-[9px] text-zinc-500 font-black uppercase tracking-wider bg-slate-900/40 border border-slate-800/40 rounded-2xl">
        <div class="w-2.5 h-2.5 border-2 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
        <span>आकड्यांचा हिशोब गोळा होत आहे...</span>
    </div>

    <!-- SECTION B & C: MAIN PERFORMANCE REPORT VIEW -->
    <div id="playerStatsMainGrid" class="space-y-2 hidden">
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 shadow-xl space-y-2">
            
            <!-- ३ मुख्य प्रिमियम कॉम्पॅक्ट बॉक्सेस -->
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-black/30 border border-slate-850 p-2 rounded-xl">
                    <span class="text-sm font-mono font-black text-white block" id="statTotalMatches">0</span>
                    <span class="text-[7.5px] font-bold text-zinc-500 uppercase tracking-tighter">Matches</span>
                </div>
                <div class="bg-black/30 border border-slate-850 p-2 rounded-xl">
                    <span class="text-sm font-mono font-black text-yellow-400 block" id="statTotalPoints">0</span>
                    <span class="text-[7.5px] font-bold text-zinc-500 uppercase tracking-tighter">Total Pts</span>
                </div>
                <div class="bg-black/30 border border-slate-850 p-2 rounded-xl">
                    <span class="text-sm font-mono font-black text-green-400 block" id="statNetImpact">0</span>
                    <span class="text-[7.5px] font-bold text-zinc-500 uppercase tracking-tighter">Net Impact</span>
                </div>
            </div>

            <!-- Raid Breakdown -->
            <div class="bg-black/20 border border-slate-850/60 rounded-xl p-2 flex flex-col space-y-1">
                <div class="flex justify-between items-center border-b border-slate-850/40 pb-0.5">
                    <span class="text-[9px] font-black text-white uppercase tracking-tight"><i class="fa-solid fa-bolt text-green-400 text-[9px] mr-1"></i> Raid Breakdown</span>
                    <span class="text-[7.5px] font-black text-green-400 bg-green-950/40 border border-green-500/10 px-1.5 py-0.2 rounded" id="statRaidSuccessRate">Success: 0%</span>
                </div>
                <div class="grid grid-cols-4 gap-0.5 text-center font-mono text-xs font-black">
                    <div><span class="text-zinc-300 block text-xs" id="statRaidTotal">0</span><span class="text-[6.5px] font-sans font-bold text-zinc-500 uppercase">Raids</span></div>
                    <div><span class="text-green-400 block text-xs" id="statRaidGain">0</span><span class="text-[6.5px] font-sans font-bold text-zinc-500 uppercase">Gain</span></div>
                    <div><span class="text-red-400 block text-xs" id="statRaidLoss">0</span><span class="text-[6.5px] font-sans font-bold text-zinc-500 uppercase">Loss</span></div>
                    <div><span class="text-gray-400 block text-xs" id="statRaidEmpty">0</span><span class="text-[6.5px] font-sans font-bold text-zinc-500 uppercase">Empty</span></div>
                </div>
            </div>

            <!-- Tackle Breakdown -->
            <div class="bg-black/20 border border-slate-850/60 rounded-xl p-2 flex flex-col space-y-1">
                <div class="flex justify-between items-center border-b border-slate-850/40 pb-0.5">
                    <span class="text-[9px] font-black text-white uppercase tracking-tight"><i class="fa-solid fa-shield text-blue-400 text-[9px] mr-1"></i> Tackle Breakdown</span>
                    <span class="text-[8px] font-black text-blue-400 bg-blue-950/40 border border-blue-500/10 px-1.5 py-0.2 rounded" id="statTackleSuccessRate">Success: 0%</span>
                </div>
                <div class="grid grid-cols-4 gap-0.5 text-center font-mono text-xs font-black">
                    <div><span class="text-zinc-300 block text-xs" id="statTackleTotal">0</span><span class="text-[6.5px] font-sans font-bold text-zinc-500 uppercase">Tackles</span></div>
                    <div><span class="text-blue-400 block text-xs" id="statTackleGain">0</span><span class="text-[6.5px] font-sans font-bold text-zinc-500 uppercase">Gain</span></div>
                    <div><span class="text-red-400 block text-xs" id="statTackleLoss">0</span><span class="text-[6.5px] font-sans font-bold text-zinc-500 uppercase">Loss</span></div>
                    <div><span class="text-purple-400 block text-xs" id="statSuperTackles">0</span><span class="text-[6.5px] font-sans font-bold text-zinc-500 uppercase">Super Tk</span></div>
                </div>
            </div>
        </div>

        <!-- SECTION C: MATCH-BY-MATCH HISTORY -->
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 shadow-xl space-y-1.5">
            <p class="text-[9px] font-black tracking-widest text-slate-400 uppercase border-b border-slate-850 pb-1">
                🏃‍♂️ Match Wise History
            </p>
            <div id="playerMatchHistoryRows" class="space-y-1 max-h-[160px] overflow-y-auto pr-0.5">
                <!-- मॅचेसची यादी -->
            </div>
        </div>
    </div>

    <!-- SECTION D: LOGOUT BUTTON -->
    <div id="profileLogoutBtnWrapper" class="flex flex-col items-center justify-center pt-1">
        <button onclick="firebase.auth().signOut()" class="w-full max-w-[150px] bg-red-600/10 hover:bg-red-600/20 text-red-500 px-4 py-2 rounded-xl font-black text-[9px] uppercase tracking-wider border border-red-600/20 active:scale-[0.98] transition-all shadow-md">
            Logout
        </button>
    </div>
</div>
